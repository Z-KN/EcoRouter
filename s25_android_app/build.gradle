plugins {
    id 'com.android.application' version '8.13.0'
    id 'org.jetbrains.kotlin.android' version '2.2.0'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.2.0'
}

// Load shared versions and utilities — must be before android {} and dependencies {}
if (file('_shared/android/common.gradle').exists()) {
    apply from: '_shared/android/common.gradle'
}

android {
    namespace 'com.geniex.demo'
    ndkVersion '27.3.13750724'
    compileSdk 34

    defaultConfig {
        applicationId 'com.geniex.demo'
        minSdk 31
        targetSdk 34
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    packaging {
        jniLibs.useLegacyPackaging = true
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // GenieX Android binding (published to Maven Central).
    implementation 'com.qualcomm.qti:geniex-android:0.3.5'

    // Embedded HTTP server: exposes /v1/chat/completions on the LAN so
    // EcoRouter can route to this phone like it does the PC and cloud.
    // Vendored at src/main/java/fi/iki/elonen/NanoHTTPD.java instead of
    // pulled from Maven -- upstream 2.3.1 does a blocking reverse-DNS
    // lookup on every non-loopback connection before serve() runs; the
    // vendored copy defers it to first actual use, which this app never
    // makes. Do not also add the Maven artifact back: same package, same
    // class names, duplicate-class build failure.

    // Kotlin
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'

    // AndroidX core
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Material Components (provides the app theme)
    implementation 'com.google.android.material:material:1.12.0'

    // Markwon (Markdown rendering)
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:ext-strikethrough:4.6.2'
    implementation 'io.noties.markwon:ext-tables:4.6.2'
    implementation 'io.noties.markwon:linkify:4.6.2'
    implementation 'io.noties.markwon:ext-latex:4.6.2'
    implementation 'io.noties.markwon:inline-parser:4.6.2'

    // Status bar (immersionbar, Maven Central)
    implementation 'com.geyifeng.immersionbar:immersionbar:3.2.2'
    implementation 'com.geyifeng.immersionbar:immersionbar-ktx:3.2.2'

    // Testing (JVM unit tests under src/test -- the router package is pure
    // Kotlin with no Android framework dependency, so it runs here directly)
    testImplementation 'junit:junit:4.13.2'

    // Testing (instrumented UI Automator tests under src/androidTest)
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
