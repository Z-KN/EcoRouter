[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecorouter"
version = "0.4.0"
description = "Hardware-aware routing across phone, PC, and cloud AI models"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Kaining Zhou" }]
dependencies = []

[project.optional-dependencies]
cloud = [
  "imagine-sdk @ https://aisuite.cirrascale.com/sdk/_downloads/3433649516f5c32f3603ae6f98c65e48/imagine_sdk-0.4.2-py3-none-any.whl",
]

[project.scripts]
ecorouter = "ecorouter.cli:main"

[tool.setuptools]
packages = ["ecorouter"]
