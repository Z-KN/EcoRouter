[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecorouter"
version = "0.1.0"
description = "Hardware-aware routing across phone, PC, and cloud AI models"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Kaining Zhou" }]
dependencies = []

[project.scripts]
ecorouter = "ecorouter.cli:main"

[tool.setuptools]
packages = ["ecorouter"]
